name: Daily Android Tests

on:
  # 03:10 UTC every day. GitHub cron is UTC-only; this is 08:40 IST.
  schedule:
    - cron: '10 3 * * *'
  # Lets you trigger a run by hand from the Actions tab.
  workflow_dispatch:
  # Also run on pushes to main so a broken commit is caught immediately.
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two emulator runs overlap on the same Pages deployment.
concurrency:
  group: daily-android-tests
  cancel-in-progress: false

jobs:
  test:
    name: Run TC-001 and TC-002
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLATFORM_VERSION: '15'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The emulator needs hardware acceleration; GitHub's runners expose KVM
      # only after these udev rules are applied.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTION+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # The device already exists on the runner image, so the udev rule alone
          # leaves it at root:kvm 660. Without access the emulator silently boots
          # unaccelerated and never finishes within the timeout.
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || echo "WARNING: no /dev/kvm - the emulator will be too slow to boot"
          id
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is readable and writable"
          else
            echo "WARNING: /dev/kvm is not accessible to this user"
          fi

      # adb and the emulator are not on PATH on a fresh runner; every later
      # step relies on them, and a missing `adb` aborts the step instantly.
      - name: Put Android tools on PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Verify Android tools
        run: |
          adb version
          emulator -version | head -1 || true
          sdkmanager --version || true

      - name: Install dependencies
        run: npm ci

      # The UiAutomator2 driver ships as the `appium-uiautomator2-driver`
      # devDependency, so Appium loads it from node_modules and no global driver
      # install is needed (that command fails on a clean runner).
      - name: Show available Appium drivers
        run: npx appium driver list --installed || true

      - name: Download the app under test
        run: npm run fetch:app

      # Created before anything can fail, so the diagnostics are always
      # publishable - a boot failure must not leave us without evidence.
      - name: Prepare diagnostics directory
        run: |
          mkdir -p ci-logs
          {
            echo "node: $(node -v)"
            echo "npm: $(npm -v)"
            echo "java: $(java -version 2>&1 | head -1)"
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            echo "cpus: $(nproc)"
            free -m
            df -h /
            ls -l /dev/kvm || echo "no /dev/kvm"
            adb version || true
            emulator -version 2>/dev/null | head -1 || true
          } | tee ci-logs/runner-env.txt

      - name: Install the SDK system image
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64" 2>&1 | tee ci-logs/sdkmanager.log

      - name: Create the AVD
        run: |
          set -uo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # Pin the AVD location: without it avdmanager can pick an XDG path and
          # the emulator then cannot find the AVD that was just created.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" | tee ci-logs/avdmanager.log

          echo "no" | avdmanager create avd \
            -n ci35 -k "system-images;android-35;google_apis;x86_64" -d pixel_6 --force \
            2>&1 | tee -a ci-logs/avdmanager.log
          rc=${PIPESTATUS[0]}
          echo "avdmanager exit code: $rc" | tee -a ci-logs/avdmanager.log

          echo "--- AVD directories found ---" | tee -a ci-logs/avdmanager.log
          find "$HOME" -maxdepth 5 \( -name "*.avd" -o -name "ci35.ini" \) 2>/dev/null \
            | tee -a ci-logs/avdmanager.log

          if [ ! -d "$ANDROID_AVD_HOME/ci35.avd" ]; then
            echo "::error::AVD ci35 was not created (avdmanager exit $rc)"
            exit 1
          fi
          "$ANDROID_HOME/emulator/emulator" -list-avds 2>&1 | tee -a ci-logs/avdmanager.log || true

      # Owned by the workflow rather than a third-party action so that the
      # emulator's own output is captured and published when boot fails.
      - name: Boot the emulator
        run: |
          set -uo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          nohup emulator -avd ci35 \
            -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim \
            -camera-back none -camera-front none -no-metrics \
            > ci-logs/emulator.log 2>&1 &
          adb start-server || true

          booted=0
          for i in $(seq 1 120); do
            # `|| true` keeps bash -e from aborting while the device is offline.
            state=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            echo "attempt $i: sys.boot_completed='${state}'" | tee -a ci-logs/boot-progress.txt
            if [ "$state" = "1" ]; then booted=1; break; fi
            sleep 5
          done

          adb devices -l | tee ci-logs/adb-devices.txt
          adb shell getprop ro.build.version.release > ci-logs/android-version.txt 2>&1 || true

          if [ "$booted" != "1" ]; then
            echo "::error::The emulator did not finish booting within 10 minutes"
            tail -100 ci-logs/emulator.log || true
            exit 1
          fi
          echo "Emulator booted"

      - name: Run tests
        run: |
          set -o pipefail
          adb devices -l | tee -a ci-logs/adb-devices.txt
          npm run test:regression 2>&1 | tee ci-logs/wdio-run.log

      - name: Seed Allure history
        if: always()
        run: |
          if [ -d allure-history ]; then
            mkdir -p allure-results/history
            cp -r allure-history/. allure-results/history/ || true
          fi

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Save Allure history for the next run
        if: always()
        run: |
          mkdir -p allure-history
          cp -r allure-report/history/. allure-history/ || true

      # CI logs are useless if they only exist behind an authenticated artifact
      # download, so publish them with the report itself.
      - name: Add CI diagnostics to the report
        if: always()
        run: |
          mkdir -p allure-report/ci-logs
          cp -r ci-logs/. allure-report/ci-logs/ 2>/dev/null || true
          cp -r reports/appium allure-report/ci-logs/appium 2>/dev/null || true
          cp -r reports/artifacts allure-report/ci-logs/artifacts 2>/dev/null || true
          ls -la allure-report/ci-logs || true

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

      - name: Upload rendered Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: ignore

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs
          if-no-files-found: ignore

      - name: Upload failure artifacts (screenshots, hierarchy, logcat)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: reports/artifacts
          if-no-files-found: ignore

      - name: Upload Appium and HTML logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-logs
          path: |
            reports/appium
            reports/html
          if-no-files-found: ignore

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: reports/junit
          if-no-files-found: ignore

      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Stage report for Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  publish:
    name: Publish Allure report to Pages
    needs: test
    if: always()
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
